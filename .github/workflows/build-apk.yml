name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - run: npm ci

      - name: Gerar projeto Android nativo
        run: npx expo prebuild --platform android

      - name: Compilar APK de release (assinado com a chave de debug padrão)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Publicar como release "apk-latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest \
            android/app/build/outputs/apk/release/app-release.apk \
            --title "Carrinho — último build" \
            --notes "APK gerado automaticamente pelo GitHub Actions a partir do commit ${{ github.sha }}. Instale habilitando \"instalar apps de fontes desconhecidas\" no Android." \
            --latest
